# Integration-fixture Dovecot config (testing-strategy §5). Cleartext
# IMAP on localhost only — never a production posture.
protocols = imap lmtp
listen = *

auth_mechanisms = plain login
disable_plaintext_auth = no

passdb {
  driver = passwd-file
  args = scheme=plain username_format=%u /etc/dovecot/users
}
userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
}

mail_location = maildir:~/Maildir

protocol imap {
  mail_plugins =
}

