[package]
name = "kestrel-engine"
description = "Engine assembly: supervisor, command router, event bus, service wiring"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
kestrel-core = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
kestrel-crypto = { workspace = true }
kestrel-storage = { workspace = true }
kestrel-sync = { workspace = true }
kestrel-filter = { workspace = true }
kestrel-calcard = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
criterion = { workspace = true }

[[bench]]
name = "engine_startup"
harness = false
