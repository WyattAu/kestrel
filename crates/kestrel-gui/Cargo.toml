[package]
name = "kestrel-gui"
description = "Native desktop frontend: Slint shell + sandboxed wry body viewport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
kestrel-core = { workspace = true }
kestrel-engine = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
slint = { version = "1.17", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2"] }
wry = "0.56"
uuid = { workspace = true }
tracing-subscriber = { workspace = true }
open = "5"
notify-rust = "4"

[build-dependencies]
slint-build = "1.17"

[[bin]]
name = "kestrel-gui"
path = "src/main.rs"

[dev-dependencies]
tempfile = { workspace = true }
# Structural HTML analysis for the security tests (threat model §7).
# Note: crawlkit-engine cannot coexist in this workspace (conflicting
# libsqlite3-sys versions: crawlkit pins 0.30, sqlx 0.9 needs 0.37);
# the same structural assertions are implemented below using an
# independent HTML tokenizer.
scraper = "0.21"
