[package]
name = "kestrel-budget-check"
description = "CI budget gate: committed P50/P99 percentile budgets vs criterion output (estate standard §5), via percentile-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# CI tooling, not a published product crate.
publish = false

[lints]
workspace = true

[dependencies]
percentile-kit = { workspace = true }
thiserror = { workspace = true }
# No workspace-hack dependency: this is a standalone CI gate, and a
# release-profile build of the workspace-hack feature union would pull
# the GUI font stack (yeslogic-fontconfig-sys) into the benches job,
# which installs no fontconfig dev libs. The crate is also listed in
# hakari's traversal-excludes so the union stays unchanged.

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }
