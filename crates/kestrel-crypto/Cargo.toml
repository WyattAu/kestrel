[package]
name = "kestrel-crypto"
description = "Credential storage, SASL/OAuth2 flows, TLS configuration, OpenPGP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
kestrel-core = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
keyring = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
webpki-roots = { workspace = true }
base64 = "0.22"
rand = "0.8"
sha2 = { workspace = true }
uuid = { workspace = true }
hmac = { workspace = true }
pbkdf2 = { workspace = true }
# S/MIME CMS bindings (Phase 5 hardening, requirements §9 addendum — landed
# early alongside OpenPGP). License exception per ADR 0012.
# The `vendored-openssl` feature (below) makes this build from source
# (openssl-src) for release legs without a target-arch OpenSSL toolchain
# (macos-x64 cross from an arm64 runner, windows-msvc); host/linux builds
# use the system libssl.
openssl = "0.10"
# OpenPGP (Phase 5, requirements §9). Sequoia 2.x (fixed RUSTSEC-2025-0136
# panic-on-malicious-PKESK in 1.x). OpenSSL crypto backend (production-ready
# per Sequoia; system libssl). License exception per ADR 0012.
sequoia-openpgp = { version = "2.4", default-features = false, features = ["crypto-openssl", "compression-deflate"] }
# OAuth2 token endpoint + JMAP HTTP transport
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# OAuth2 flows (PKCE/loopback/token/provider presets) — extracted crate.
oauth-toolkit = { workspace = true }

[features]
# Builds OpenSSL from source (openssl-src) so openssl-sys needs no system
# library. Required on release legs without a target-arch OpenSSL; see the
# openssl comment above.
vendored-openssl = ["openssl/vendored"]

# Feature carrier for keyring's `async-secret-service` backend (zbus, pure
# Rust — replaces the libdbus C dependency that broke aarch64 cross
# builds). keyring does not select a runtime on secret-service itself, so
# the workspace pins one: tokio (our runtime) + crypto-rust (no extra
# native dep). Never imported here — cargo-machete ignored below.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "4", default-features = false, features = ["rt-tokio-crypto-rust"] }

[package.metadata.cargo-machete]
ignored = ["secret-service"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
criterion = { workspace = true }

[[bench]]
name = "openpgp_crypto"
harness = false
