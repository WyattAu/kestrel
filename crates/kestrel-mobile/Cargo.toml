[package]
name = "kestrel-mobile"
description = "Mobile frontend: Slint mobile shell with platform integration stubs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
kestrel-core = { workspace = true }
kestrel-engine = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
slint = { version = "1.17", default-features = false, features = ["std", "compat-1-2"] }

# imap-next (via kestrel-sync) has no rustls backend: native-tls pulls
# openssl-sys, which needs a real OpenSSL for the android target. Build
# OpenSSL from source for android only (host builds keep the system lib).
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

# cargo-machete: kestrel-mobile compiles for android/ios targets; every dep
# below is used under `#[cfg(target_os = ...)]` / the FFI boundary, which the
# host-side static scan cannot see (ADR 0013).
[package.metadata.cargo-machete]
ignored = [
  "kestrel-core",
  "kestrel-engine",
  "openssl",
  "slint",
  "thiserror",
  "tokio",
  "tokio-util",
  "tracing",
]
