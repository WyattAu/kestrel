name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsqlite3-dev pkg-config
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    env:
      # NOT KESTREL_-prefixed: Config::load treats every KESTREL_* var as
      # layered config and rejects unknown keys, so a KESTREL_PROPTOP_CASES
      # here broke every config test (unknown field: proptop_cases).
      PROPTEST_CASES: "256"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsqlite3-dev pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace
      - name: Enforce threat-model §7 test matrix
        run: bash scripts/check-threat-matrix.sh

  webview-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # libgl1-mesa-dri: the Slint shell renders via femtovg/OpenGL; headless
      # runners have no GPU, so software GL (llvmpipe) must be available. The
      # libxkbcommon/xcb set is what winit dlopens at startup under X11.
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsqlite3-dev libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xfixes0 libxcb-render-util0 pkg-config xvfb
      - name: Network-isolation test for the viewport (threat-model T3)
        run: bash scripts/webview-netns-test.sh

  startup-harness:
    runs-on: ubuntu-latest
    # Real-binary cold-start + idle-RSS measurement (backlog #3). Runs after
    # merge and on demand; builds both frontends in release.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # libgl1-mesa-dri: the Slint shell renders via femtovg/OpenGL; headless
      # runners have no GPU, so software GL (llvmpipe) must be available. The
      # libxkbcommon/xcb set is what winit dlopens at startup under X11.
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsqlite3-dev libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xfixes0 libxcb-render-util0 pkg-config xvfb
      - run: cargo build -p kestrel-tui -p kestrel-gui --release
      - name: Measure GUI startup + idle RSS
        run: bash scripts/measure-process-startup.sh target/release/kestrel-gui --xvfb
      - name: Measure TUI startup + idle RSS
        run: bash scripts/measure-process-startup.sh target/release/kestrel-tui

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libsqlite3-dev pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Start integration services
        run: docker compose -f tests/integration/docker-compose.yml up -d
      - name: Wait for services
        run: docker compose -f tests/integration/docker-compose.yml ps
      # The docker-gated tests are #[ignore]d; --run-ignored is the supported
      # way to force-run the ones the integration profile selects.
      - run: cargo nextest run --profile integration --run-ignored ignored-only
        env:
          KESTREL_INTEGRATION: "1"
      - name: Tear down services
        if: always()
        run: docker compose -f tests/integration/docker-compose.yml down -v

  sqlx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # sqlx prepare compiles workspace members (gui pulls webkit/gtk/dbus).
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libsqlite3-dev sqlite3 pkg-config
      - uses: taiki-e/install-action@v2
        with:
          # cargo-sqlx does not exist as an install-action/binstall crate;
          # the CLI crate is sqlx-cli (must match the workspace sqlx 0.9).
          tool: sqlx-cli@0.9
      - name: Verify offline query metadata freshness
        run: |
          export DATABASE_URL=$(./scripts/sqlx-prepare-db.sh | grep DATABASE_URL | cut -d= -f2)
          cargo sqlx prepare --check --workspace

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsqlite3-dev pkg-config
      - env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: Check for unused dependencies
        run: cargo machete

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify relative markdown links resolve
        run: bash scripts/check-doc-links.sh

  tls-backend:
    # ADR 0016: rustls is the sole transport-TLS backend; bans
    # reqwest::Client::new() (native-tls under feature unification).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce rustls-only transport TLS
        run: bash scripts/check-tls-backend.sh

  benches:
    # Pin hardware by setting the BENCH_RUNNER repository variable to a
    # self-hosted label (engineering-standards §5); default to GH-hosted.
    runs-on: ${{ vars.BENCH_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config
      - name: Run benchmarks
        run: cargo bench --workspace 2>&1 | tee bench-output.txt
      - name: Enforce SLA thresholds
        run: |
          parse_mean_ms() {
            local pattern="$1"
            local line mean_raw unit
            line=$(grep -P "$pattern\\s+time:" bench-output.txt || true)
            if [ -z "$line" ]; then echo ""; return; fi
            mean_raw=$(echo "$line" | grep -oP 'time:\\s+\\[\\K[0-9.]+')
            unit=$(echo "$line" | grep -oP 'time:\\s+\\[[0-9.]+\\s+\\K\\S+')
            case "$unit" in
              ns) echo "scale=4; $mean_raw / 1000000" | bc ;;
              us) echo "scale=4; $mean_raw / 1000" | bc ;;
              ms) echo "$mean_raw" ;;
              s)  echo "scale=4; $mean_raw * 1000" | bc ;;
              *)  echo ""; return ;;
            esac
          }

          FAIL=0

          # Ingest: fail < 800 msgs/sec
          MEAN_SEC=$(grep -oP 'ingest/envelopes_100/batch\s+time:\s+\[\K[0-9.]+' bench-output.txt | head -1)
          if [ -z "$MEAN_SEC" ]; then
            echo "::warning::Could not parse ingest benchmark output."
          else
            MSGS_PER_SEC=$(echo "scale=2; 100 / $MEAN_SEC" | bc)
            echo "Ingest: ${MSGS_PER_SEC} msgs/sec (threshold: 800 msgs/sec)"
            if [ "$(echo "$MSGS_PER_SEC < 800" | bc)" -eq 1 ]; then
              echo "::error::Ingest SLA FAILED: ${MSGS_PER_SEC} msgs/sec < 800 msgs/sec"
              FAIL=1
            fi
          fi

          # Search 100k: fail > 50ms, warn > 15ms
          MS=$(parse_mean_ms "search_100k/text_query_first_50")
          if [ -n "$MS" ]; then
            echo "Search 100k: ${MS} ms (fail > 50ms, warn > 15ms)"
            if [ "$(echo "$MS > 50" | bc)" -eq 1 ]; then
              echo "::error::Search 100k SLA FAILED: ${MS} ms > 50 ms"
              FAIL=1
            elif [ "$(echo "$MS > 15" | bc)" -eq 1 ]; then
              echo "::warning::Search 100k above target: ${MS} ms > 15 ms"
            fi
          else
            echo "::warning::Could not parse search_100k benchmark."
          fi

          # Search 500k: fail > 30ms
          MS=$(parse_mean_ms "search_500k/text_query_first_50")
          if [ -n "$MS" ]; then
            echo "Search 500k: ${MS} ms (fail > 30ms)"
            if [ "$(echo "$MS > 30" | bc)" -eq 1 ]; then
              echo "::error::Search 500k SLA FAILED: ${MS} ms > 30 ms"
              FAIL=1
            fi
          else
            echo "::warning::Could not parse search_500k benchmark."
          fi

          # TUI cold-start: fail > 150ms, warn > 50ms
          MS=$(parse_mean_ms "tui_cold_start/config_paths_app_state")
          if [ -n "$MS" ]; then
            echo "TUI cold-start: ${MS} ms (fail > 150ms, warn > 50ms)"
            if [ "$(echo "$MS > 150" | bc)" -eq 1 ]; then
              echo "::error::TUI cold-start SLA FAILED: ${MS} ms > 150 ms"
              FAIL=1
            elif [ "$(echo "$MS > 50" | bc)" -eq 1 ]; then
              echo "::warning::TUI cold-start above target: ${MS} ms > 50 ms"
            fi
          else
            echo "::warning::Could not parse tui_cold_start benchmark."
          fi

          # GUI cold-start: fail > 500ms, warn > 200ms
          MS=$(parse_mean_ms "gui_cold_start/config_paths_viewport_state")
          if [ -n "$MS" ]; then
            echo "GUI cold-start: ${MS} ms (fail > 500ms, warn > 200ms)"
            if [ "$(echo "$MS > 500" | bc)" -eq 1 ]; then
              echo "::error::GUI cold-start SLA FAILED: ${MS} ms > 500 ms"
              FAIL=1
            elif [ "$(echo "$MS > 200" | bc)" -eq 1 ]; then
              echo "::warning::GUI cold-start above target: ${MS} ms > 200 ms"
            fi
          else
            echo "::warning::Could not parse gui_cold_start benchmark."
          fi

          # Engine cold-start: fail > 50ms
          MS=$(parse_mean_ms "engine_cold_start/0_accounts")
          if [ -n "$MS" ]; then
            echo "Engine cold-start: ${MS} ms (fail > 50ms)"
            if [ "$(echo "$MS > 50" | bc)" -eq 1 ]; then
              echo "::error::Engine cold-start SLA FAILED: ${MS} ms > 50 ms"
              FAIL=1
            fi
          else
            echo "::warning::Could not parse engine_cold_start benchmark."
          fi

          if [ "$FAIL" -eq 1 ]; then echo "::error::SLA enforcement failed."; exit 1; fi
          echo "All SLA thresholds passed."
      - name: Enforce baseline regression gate (no >10% regression)
        run: |
          parse_mean_ms() {
            local pattern="$1"
            local line mean_raw unit
            line=$(grep -P "$pattern\\s+time:" bench-output.txt || true)
            if [ -z "$line" ]; then echo ""; return; fi
            mean_raw=$(echo "$line" | grep -oP 'time:\\s+\\[\\K[0-9.]+')
            unit=$(echo "$line" | grep -oP 'time:\\s+\\[[0-9.]+\\s+\\K\\S+')
            case "$unit" in
              ns) echo "scale=4; $mean_raw / 1000000" | bc ;;
              us) echo "scale=4; $mean_raw / 1000" | bc ;;
              ms) echo "$mean_raw" ;;
              s)  echo "scale=4; $mean_raw * 1000" | bc ;;
              *)  echo ""; return ;;
            esac
          }

          # Latency benchmarks (higher = worse): fail if measured > 1.10 x
          # the committed baseline in benches/baselines/.
          check_latency() {
            local name="$1" pattern="$2" file="$3"
            local ms base limit
            ms=$(parse_mean_ms "$pattern")
            if [ -z "$ms" ]; then
              echo "::warning::Baseline gate: could not measure $name."
              return
            fi
            base=$(grep -oP '"mean_ms":\\s*\\K[0-9.]+' "$file" || true)
            if [ -z "$base" ]; then
              echo "::warning::Baseline gate: no baseline recorded for $name."
              return
            fi
            limit=$(echo "scale=4; $base * 1.10" | bc)
            if [ "$(echo "$ms > $limit" | bc)" -eq 1 ]; then
              echo "::error::Baseline regression: $name ${ms} ms > 1.10 x baseline ${base} ms"
              FAIL=1
            else
              echo "Baseline ok: $name ${ms} ms (baseline ${base} ms, limit ${limit} ms)"
            fi
          }

          FAIL=0
          check_latency "search_100k" "search_100k/text_query_first_50" benches/baselines/search_100k.json
          check_latency "search_500k" "search_500k/text_query_first_50" benches/baselines/search_500k.json
          check_latency "tui_cold_start" "tui_cold_start/config_paths_app_state" benches/baselines/tui_cold_start.json
          check_latency "gui_cold_start" "gui_cold_start/config_paths_viewport_state" benches/baselines/gui_cold_start.json
          check_latency "engine_cold_start" "engine_cold_start/0_accounts" benches/baselines/engine_cold_start.json

          # Ingest throughput (higher = better): fail if measured < 0.90 x
          # the baseline msgs/sec.
          MEAN_SEC=$(grep -oP 'ingest/envelopes_100/batch\\s+time:\\s+\\[\\K[0-9.]+' bench-output.txt | head -1)
          if [ -n "$MEAN_SEC" ]; then
            MSGS_PER_SEC=$(echo "scale=2; 100 / $MEAN_SEC" | bc)
            BASE=$(grep -oP '"mean_msgs_per_sec":\\s*\\K[0-9.]+' benches/baselines/ingest.json || true)
            if [ -n "$BASE" ]; then
              LIMIT=$(echo "scale=2; $BASE * 0.90" | bc)
              if [ "$(echo "$MSGS_PER_SEC < $LIMIT" | bc)" -eq 1 ]; then
                echo "::error::Baseline regression: ingest ${MSGS_PER_SEC} msgs/sec < 0.90 x baseline ${BASE} msgs/sec"
                FAIL=1
              else
                echo "Baseline ok: ingest ${MSGS_PER_SEC} msgs/sec (baseline ${BASE} msgs/sec, limit ${LIMIT})"
              fi
            fi
          else
            echo "::warning::Baseline gate: could not measure ingest."
          fi

          if [ "$FAIL" -eq 1 ]; then echo "::error::Baseline regression gate failed."; exit 1; fi
          echo "All benchmarks within 10% of their baselines."
      # Idle-memory SLA (requirements §8: TUI 25/40 MB, GUI 120/200 MB)
      # is enforced end-to-end against the real binaries in the
      # startup-harness job; a debug test-process RSS (static code pages of
      # the whole linked tree) is not a meaningful proxy and was failing on
      # its own allocator noise.

  cli-interop:
    runs-on: ubuntu-latest
    # Backlog #15: OpenPGP (gpg) and S/MIME (openssl) reference-CLI round
    # trips. Tests are #[ignore]d (plain runs stay hermetic); this job
    # installs the CLIs and force-runs them.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # libdbus-1-dev: the kestrel-crypto keyring backend pulls libdbus-sys.
      - run: sudo apt-get update && sudo apt-get install -y gnupg openssl libdbus-1-dev pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run OpenPGP + S/MIME CLI interop matrix
        run: cargo nextest run -p kestrel-crypto --test cli_interop --run-ignored ignored-only

  providers:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsqlite3-dev pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run provider integration tests
        run: cargo nextest run --package kestrel-sync --test provider_real -- --ignored --nocapture
        env:
          KESTREL_PROVIDER_INTEGRATION: "1"
          KESTREL_PROVIDER_NAME: ${{ vars.KESTREL_PROVIDER_NAME }}
          KESTREL_PROVIDER_IMAP_HOST: ${{ vars.KESTREL_PROVIDER_IMAP_HOST }}
          KESTREL_PROVIDER_IMAP_PORT: ${{ vars.KESTREL_PROVIDER_IMAP_PORT || '993' }}
          KESTREL_PROVIDER_EMAIL: ${{ secrets.KESTREL_PROVIDER_EMAIL }}
          KESTREL_PROVIDER_PASSWORD: ${{ secrets.KESTREL_PROVIDER_PASSWORD }}

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # fontconfig: kestrel-mobile's UI stack links it on Linux hosts.
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libfontconfig1-dev libsqlite3-dev pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run kestrel-mobile tests
        run: cargo nextest run --package kestrel-mobile
      - name: Clippy kestrel-mobile
        run: cargo clippy --package kestrel-mobile --all-targets -- -D warnings

  mobile-cross:
    runs-on: ubuntu-latest
    # aarch64 only: the x86_64-android (emulator) leg cannot build the
    # engine's vendored OpenSSL — openssl-src emits SM4/VAES asm the NDK
    # assembler rejects (tracked in issue #18). The realistic device target
    # is aarch64.
    strategy:
      matrix:
        target:
          - aarch64-linux-android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins channel "1.97.1", and cargo resolves to the
      # version-named toolchain, not dtolnay's "stable" — so install the
      # target on the toolchain cargo will actually use.
      - run: rustup target add ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libsqlite3-dev pkg-config
      # ring/sqlite/openssl build scripts need the NDK clang for the target
      # triple ("<triple>-clang"), which only ships in the NDK; cc-rs does
      # not auto-discover it here, so export the per-target CC/AR explicitly.
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK and export target toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "ndk;26.3.11579264" >/dev/null
          NDK="$ANDROID_SDK_ROOT/ndk/26.3.11579264"
          BIN="$(ls -d "$NDK"/toolchains/llvm/prebuilt/*/bin | head -1)"
          TRIPLE_CC_VAR="CC_${TARGET//-/_}"
          TRIPLE_AR_VAR="AR_${TARGET//-/_}"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "$TRIPLE_CC_VAR=$BIN/${{ matrix.target }}21-clang" >> "$GITHUB_ENV"
          echo "$TRIPLE_AR_VAR=$BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "$BIN" >> "$GITHUB_PATH"
        env:
          TARGET: ${{ matrix.target }}
      - run: cargo check --package kestrel-mobile --target ${{ matrix.target }}

  fuzz:
    runs-on: ubuntu-latest
    # cargo-fuzz drives rustc with -Z flags (libFuzzer + ASan): nightly is
    # mandatory. RUSTUP_TOOLCHAIN forces nightly over rust-toolchain.toml's
    # pinned stable channel. The taiki cargo-fuzz release binary is built for
    # musl, so cargo-fuzz defaults the fuzz target to x86_64-unknown-linux-musl
    # — but the fuzz graph pulls imap-next → native-tls → openssl-sys, which
    # cannot build against a static libc. Force the GNU target (system
    # openssl) and drop the repo-wide -D warnings (third-party lints).
    env:
      RUSTUP_TOOLCHAIN: nightly
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsqlite3-dev libssl-dev pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz all targets (60s each)
        working-directory: fuzz
        run: |
          TARGETS=(fuzz_mime_adapter fuzz_link_classifier fuzz_html_sanitizer fuzz_terminal_sanitizer fuzz_imap_response)
          FAIL=0
          for target in "${TARGETS[@]}"; do
            echo "::group::Fuzzing $target"
            if cargo fuzz run "$target" --target x86_64-unknown-linux-gnu -- -max_total_time=60 -max_len=4096; then
              echo "$target: PASS (60s, no crash)"
            else
              echo "::error::$target: FUZZ CRASH DETECTED"
              FAIL=1
            fi
            echo "::endgroup::"
          done
          if [ "$FAIL" -eq 1 ]; then echo "::error::Fuzz crashes detected."; exit 1; fi
          echo "All fuzz targets passed."

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsqlite3-dev pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Serialized: config tests share the process env under cargo test
      # (the KESTREL_* merge), so RUST_TEST_THREADS=1 keeps llvm-cov stable.
      - name: Generate coverage report
        run: RUST_TEST_THREADS=1 cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Gate core line coverage (issue #10: floor 75%, measured 90.4%)
        run: cargo llvm-cov report -p kestrel-core --fail-under-lines 75
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 30
      - name: Print coverage summary
        run: cargo llvm-cov report --summary-only
