name: Weekly Fuzz
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Fuzz duration in seconds'
        required: false
        default: '600'
jobs:
  fuzz-deep:
    runs-on: ubuntu-latest
    # cargo-fuzz needs nightly (-Z flags); RUSTUP_TOOLCHAIN overrides the
    # stable channel pinned in rust-toolchain.toml. The taiki cargo-fuzz
    # release binary is musl-built, so cargo-fuzz defaults the fuzz target to
    # musl — but the fuzz graph pulls imap-next → native-tls → openssl-sys,
    # which cannot build against a static libc. Force the GNU target (system
    # openssl) and drop the repo-wide -D warnings.
    env:
      RUSTUP_TOOLCHAIN: nightly
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsqlite3-dev libssl-dev pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Deep fuzz all targets
        working-directory: fuzz
        run: |
          DURATION=${{ github.event.inputs.duration || '600' }}
          TARGETS=(fuzz_mime_adapter fuzz_link_classifier fuzz_html_sanitizer fuzz_terminal_sanitizer fuzz_imap_response)
          FAIL=0
          for target in "${TARGETS[@]}"; do
            echo "::group::Deep fuzzing $target (${DURATION}s)"
            if cargo fuzz run "$target" --target x86_64-unknown-linux-gnu -- -max_total_time="$DURATION" -max_len=4096; then
              echo "$target: PASS"
            else
              echo "::error::$target: CRASH"
              FAIL=1
            fi
            echo "::endgroup::"
          done
          if [ "$FAIL" -eq 1 ]; then echo "::error::Deep fuzz crashes."; exit 1; fi
