name: Release

on:
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # id-token/attestations: the provenance step signs via OIDC (SLSA).
    # Job-scoped so the test job keeps only what it needs.
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Host-arch legs build both frontends. The aarch64-linux leg is
          # cross-compiled and therefore TUI-only: kestrel-gui links wry →
          # WebKitGTK, which has no aarch64 cross sysroot on ubuntu-latest
          # (the packaged -dev:arm64 set is incomplete for webkit2gtk-4.1).
          # A native aarch64 runner (or a full arm64 webkit sysroot) is the
          # tracked follow-up (issue #16).
          #
          # `vendored` legs have no target-arch OpenSSL toolchain: OpenSSL
          # (sequoia crypto-openssl + S/MIME, ADR 0012) is built from source
          # via kestrel-crypto/vendored-openssl instead of system libssl.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            crates: kestrel-tui kestrel-gui
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
            vendored: true
            crates: kestrel-tui
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            vendored: true
            crates: kestrel-tui kestrel-gui
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            crates: kestrel-tui kestrel-gui
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            vendored: true
            crates: kestrel-tui kestrel-gui

    steps:
      - uses: actions/checkout@v4

      # Same toolchain handling as ci.yml mobile-cross: rust-toolchain.toml
      # pins channel "1.97.1" and cargo resolves to the version-named
      # toolchain, not dtolnay's "stable" — so install each matrix target on
      # the toolchain cargo will actually use.
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
          # Vendored legs compile ~10 min of OpenSSL from source; keep that
          # cache even when a leg fails (most failures are in later steps,
          # e.g. smoke/attest) so retry runs start warm.

      # openssl-src builds OpenSSL via perl; windows runners' Git-Bash perl
      # lacks Locale::Maketext::Simple (the @INC in the failure log is
      # MSYS2's), so build with Strawberry's perl explicitly.
      - name: Use Strawberry Perl for vendored OpenSSL (Windows)
        if: matrix.vendored && runner.os == 'Windows'
        run: |
          if (-not (Test-Path 'C:\Strawberry\perl\bin\perl.exe')) {
            choco install strawberryperl -y --no-progress
          }
          Add-Content $env:GITHUB_ENV "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe"

      - name: Install cross-compilation toolchain (aarch64-linux)
        if: matrix.cross
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list; sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"
          # OpenSSL for the target comes from kestrel-crypto/vendored-openssl
          # (built from source by openssl-src); no multiarch libssl-dev or
          # ports-archive apt setup needed. The deb822-sources approach this
          # replaces 404'd on binary-arm64 security indexes.

      - name: Install Linux build dependencies
        # Host-arch GUI libs (webkit2gtk/gtk) are only needed by legs that
        # link wry natively; the TUI-only cross leg skips them.
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list; sudo apt-get update
          # webkit2gtk-4.1/gtk-3: kestrel-gui's wry viewport links WebKitGTK.
          # libssl-dev: sequoia's crypto-openssl backend pulls openssl-sys
          # (ADR 0012; transport TLS itself is rustls per ADR 0016).
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsqlite3-dev libssl-dev pkg-config

      # matrix.crates is a space-separated list: one -p flag would leave the
      # second package as a stray positional arg ("unexpected argument").
      - name: Build release binaries
        shell: bash
        run: |
          ARGS=""
          for pkg in ${{ matrix.crates }}; do
            ARGS="${ARGS} -p ${pkg}"
          done
          if [ "${{ matrix.vendored }}" = "true" ]; then
            # --features pkg/feat requires that package in the selection
            # ("none of the selected packages contains this feature"), so
            # kestrel-crypto must be added explicitly.
            ARGS="${ARGS} -p kestrel-crypto --features kestrel-crypto/vendored-openssl"
          fi
          cargo build --release --locked --target ${{ matrix.target }} ${ARGS}

      - name: Strip binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          for bin in ${{ matrix.crates }}; do
            strip "target/${{ matrix.target }}/release/$bin" || true
          done

      # Relocated-binary smoke test. CI compiles in-tree, so a binary that
      # still references the build tree at runtime (e.g. an env!("CARGO_MANIFEST_DIR")
      # migration path) passes every in-tree check and only breaks in the
      # field. Boot the engine from a scratch dir with a fresh fake HOME;
      # `tui --help` exits 0 after full engine startup. Skipped on legs whose
      # target cannot execute on the runner (aarch64 cross-build; x86_64
      # macOS built from an arm64 host would need Rosetta) — the class of
      # bug this guards against is host-architecture-independent.
      - name: Smoke-test relocated binaries
        if: matrix.cross != true && matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -e
          SMOKE="$(mktemp -d)"
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; fi
          for bin in ${{ matrix.crates }}; do
            [ -x "target/${{ matrix.target }}/release/$bin$EXT" ] || { echo "missing binary: $bin$EXT"; exit 1; }
          done
          cp "target/${{ matrix.target }}/release/kestrel-tui$EXT" "$SMOKE/"
          cd "$SMOKE"
          # With stdout piped, a healthy boot is: engine starts (embedded
          # migrations run), then the TUI refuses for lack of a TTY and
          # exits 1 — or hangs in the run loop until timeout kills it
          # (exit 124). Boot failure (e.g. migration_failed) is the only
          # failure mode this gate exists for.
          set +e
          # macOS runners have no GNU `timeout`; perl is present everywhere
          # (macOS, ubuntu, Git Bash) and alarm survives exec.
          if command -v timeout >/dev/null 2>&1; then
            HOME="$SMOKE" XDG_DATA_HOME="$SMOKE/data" timeout 60 "./kestrel-tui$EXT" --help > smoke.log 2>&1
          else
            HOME="$SMOKE" XDG_DATA_HOME="$SMOKE/data" perl -e 'alarm 60; exec @ARGV' "./kestrel-tui$EXT" --help > smoke.log 2>&1
          fi
          STATUS=$?
          set -e
          # 124 = GNU timeout, 142 = SIGALRM from perl alarm.
          if [ "$STATUS" -ne 124 ] && [ "$STATUS" -ne 142 ] && ! grep -q "stdout is not a terminal" smoke.log; then
            echo "relocated binary did not boot cleanly (exit $STATUS):"
            cat smoke.log
            exit 1
          fi
          if grep -qE "migration_failed|CARGO_MANIFEST_DIR|/home/runner" smoke.log; then
            echo "relocated binary references build tree or failed migrations:"
            cat smoke.log
            exit 1
          fi
          echo "--- relocated tui boot ok (exit $STATUS) ---"
          tail -5 smoke.log

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGING="kestrel-${VERSION}-${{ matrix.target }}"
          mkdir -p "${STAGING}"
          for bin in ${{ matrix.crates }}; do
            cp "target/${{ matrix.target }}/release/$bin" "${STAGING}/"
          done
          tar czf "${STAGING}.tar.gz" "${STAGING}"
          echo "ASSET=${STAGING}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGING="kestrel-${VERSION}-${{ matrix.target }}"
          mkdir -p "${STAGING}"
          for bin in ${{ matrix.crates }}; do
            cp "target/${{ matrix.target }}/release/$bin.exe" "${STAGING}/"
          done
          7z a "${STAGING}.zip" "${STAGING}"
          echo "ASSET=${STAGING}.zip" >> "$GITHUB_ENV"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}

      # SLSA-style provenance for the exact asset uploaded above. The
      # attestation records the workflow + repo + subject digest, so a
      # downloaded artifact can be verified against the build that produced
      # it (docs/release-checklist.md §4). Provenance for an asset that
      # fails to attach is a release-blocking error, not a warning.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.ASSET }}

  test:
    name: Test release build
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # Full workspace compile (unit + doc tests), so mirror the job dep set
      # that makes ci.yml's test/integration jobs green.
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list; sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libsqlite3-dev libssl-dev pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace
